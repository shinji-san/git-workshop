# yaml-language-server: $schema=./exercise.schema.json
# Sprachneutrale STRUKTUR der Aufgabe. Texte und lokalisierte Werte (${vars}): i18n/<locale>.yaml.
schemaVersion: 2
id: cb601aba-8d76-461a-9f94-ec9f39ae510a
chapter: "4.0"
durationMinutes: 8

# Freischalt-Gate (Code wird im Workshop angesagt; hier steht nur der salted SHA-256-Hash).
unlock:
  salt: "5fe4a1acc0254793"
  hash: "a00728966a9765979547c0612a5ff3c17b9e6759c4ad6e9a1f4764825cdfcda1"

# Kein bundle: Die Sandbox legt ein vorbereitetes Arbeits-Repo mit zwei Commits an.
# Der jüngste Commit (${commitImportant}) soll am Ende im Bare-Repo ankommen.
provisioning:
  setup:
    - git init -q
    - printf "${readmeTitle}\n" > README.md
    - git add README.md
    - git commit -q -m "${commitInitial}"
    - printf "console.log('feature');\n" > feature.js
    - git add feature.js
    - git commit -q -m "${commitImportant}"

steps:
  - id: init-bare
    goals:
      - type: gitCommandUsed
        name: init
        argsContain: ["--bare"]

  - id: add-remote
    goals:
      - type: gitConfig
        key: remote.origin.url

  - id: push
    goals:
      - type: commitExists
        summary: ${commitImportant}
        reachableFrom: origin/main
