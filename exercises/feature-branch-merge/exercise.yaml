# yaml-language-server: $schema=./exercise.schema.json
# Sprachneutrale STRUKTUR der Aufgabe: Ids, Ziele, Pitfall-Bedingungen, Provisioning.
# Alle Texte liegen in i18n/<locale>.yaml; lokalisierte Werte kommen von dort als ${vars}.
schemaVersion: 2
id: 5828a258-8371-43c6-af97-3505fa89fa88
chapter: "2.0"
durationMinutes: 5

# Freischalt-Gate (Code wird im Workshop angesagt; hier steht nur der salted SHA-256-Hash).
unlock:
  salt: "0d8b0f605a2207d6"
  hash: "53e798fac3da7a9483127a5e24aac1e245a6ed15c8ac337110592ba338c4d7e4"

provisioning:
  bundle: ./feature-branch-merge.${locale}.bundle   # pro Sprache gebaut (Inhalte aus vars), relativ zum Paket
  keepOrigin: false
  # Startzustand (im Bundle): main und feature sind divergiert.
  #   * Add feature              (feature)
  #   | * <Hinweise in main>     (main, HEAD)
  #   |/
  #   * Init Repo
  # Weil beide Branches eigene Commits seit dem gemeinsamen Vorfahren haben, erzeugt
  # ein normaler Merge einen echten Merge-Commit (kein Fast-Forward).
  # setup ist optional – nur noetig, wenn der Startzustand uncommittete Aenderungen,
  # einen detached HEAD oder einen halben Rebase braucht:
  # setup:
  #   - printf "Notiz\n" >> notes.txt   # laeuft in der Sandbox-Shell

commonPitfalls:                            # gelten in JEDEM Schritt
  - id: detached-head
    when:
      - type: headDetached
    severity: warning

steps:
  - id: review-feature
    goals:
      - type: headOnBranch
        name: feature

  - id: merge-back
    goals:
      - type: headOnBranch
        name: main
      - type: tipHasParents
        branch: main
        count: 2
    pitfalls:
      - id: merge-direction-reversed
        when:
          - type: tipHasParents
            branch: feature
            count: 2
        severity: warning
