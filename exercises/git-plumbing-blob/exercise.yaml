# yaml-language-server: $schema=./exercise.schema.json
# Sprachneutrale STRUKTUR der Aufgabe. Texte und lokalisierte Werte (${vars}): i18n/<locale>.yaml.
schemaVersion: 2
id: 935a02ac-6003-4b4c-a07e-d858d5c854ae
chapter: "3.0"
durationMinutes: 5

# Freischalt-Gate (Code wird im Workshop angesagt; hier steht nur der salted SHA-256-Hash).
unlock:
  salt: "9b606571dff2e003"
  hash: "1206dd97570837de4216609102cec0f80e28fc761e0259af495426eb7fa18ffc"

# Kein bundle: Die Sandbox initialisiert ein leeres Repo und legt eine Datei an.
# Der Fokus liegt auf den Plumbing-Befehlen, nicht auf dem Setup.
provisioning:
  setup:
    - git init -q
    - printf "${letterContent}\n" > ${letterFile}

steps:
  - id: write-blob
    goals:
      # B: der richtige Plumbing-Befehl wurde benutzt (mit -w geschrieben, nicht nur gehasht)
      - type: gitCommandUsed
        name: hash-object
        argsContain: ["-w"]
      # A: die Wirkung ist eingetreten - ein Blob liegt jetzt in der Objektdatenbank
      - type: objectExists
        kind: blob

  - id: read-blob
    goals:
      - type: gitCommandUsed
        name: cat-file
        argsContain: ["-p"]
