# Freischalt-Gate (Code wird im Workshop angesagt; hier steht nur der salted SHA-256-Hash).
unlock:
  salt: "7c70fc6ea7a899e1"
  hash: "c0190fbc0274727d85f18f5d58565141ee2ca3387c65c81a06277611105c8d70"

# Kein bundle: Die Sandbox legt ein Repo mit einem Commit an und erzeugt anschließend
# zwei verwaiste Commits per `git commit-tree` (von keinem Ref referenziert und NICHT im
# Reflog – sonst würde der Reflog sie am Leben halten und gc könnte sie nicht entfernen).
provisioning:
  setup:
    - git init -q
    - printf "${content}\n" > ${file}
    - git add ${file}
    - git commit -q -m "${commitBase}"
    - git commit-tree -m "${orphanA}" 'HEAD^{tree}' > /dev/null
    - git commit-tree -m "${orphanB}" 'HEAD^{tree}' > /dev/null

steps:
  - id: gc-prune
    goals:
      - type: noDanglingCommits
