# yaml-language-server: $schema=./exercise.schema.json
# Sprachneutrale STRUKTUR der Aufgabe. Texte und lokalisierte Werte (${vars}): i18n/<locale>.yaml.
schemaVersion: 2
id: 44046a85-6d99-44ce-9650-1b1edd6013b3
chapter: "5.0"
durationMinutes: 8

# Freischalt-Gate (Code wird im Workshop angesagt; hier steht nur der salted SHA-256-Hash).
unlock:
  salt: "162b19df340f8ef6"
  hash: "e833f6a85ca608705fa0b6d52eba1a87bd4c659b052d557a3f8cf60b6ec029bd"

# Kein bundle: Die Sandbox legt ein Arbeits-Repo mit drei Commits an.
# Der jüngste Commit (${commitImportant}) wird im ersten Schritt per Hard-Reset verloren.
provisioning:
  setup:
    - git init -q
    - printf "${line1}\n" > ${workFile}
    - git add ${workFile}
    - git commit -q -m "${commitFirst}"
    - printf "${line2}\n" >> ${workFile}
    - git add ${workFile}
    - git commit -q -m "${commitSecond}"
    - printf "${line3}\n" >> ${workFile}
    - git add ${workFile}
    - git commit -q -m "${commitImportant}"

steps:
  - id: hard-reset
    goals:
      - type: danglingCommitExists
        summary: ${commitImportant}

  - id: rescue
    goals:
      - type: gitCommandUsed
        name: reflog
      - type: branchExists
        name: ${rescueBranch}
      - type: headOnBranch
        name: ${rescueBranch}
      - type: commitExists
        summary: ${commitImportant}
        reachableFrom: ${rescueBranch}
