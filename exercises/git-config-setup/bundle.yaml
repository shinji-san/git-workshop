# Deklarative Historie fuer das Aufgaben-Bundle (gebaut von: npm run bundles:gen).
# Die .bundle-Dateien selbst sind nicht versioniert (.gitignore) – diese Datei IST die Quelle.
# ${readme} kommt aus den vars der Textdateien -> ein Bundle pro Sprache (siehe exercise.yaml).
# Minimaler Startzustand: ein Commit auf main; die Konfiguration setzt der Teilnehmer.
defaultBranch: main
head: main
ops:
  - commit: Init Repo
    files:
      README.md: "${readme}"
