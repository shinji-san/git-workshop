# yaml-language-server: $schema=./exercise.schema.json
# Sprachneutrale STRUKTUR der Aufgabe: Ids, Ziele, Provisioning. Texte: i18n/<locale>.yaml.
# Lokalisierte WERTE (Dateiname, Inhalt, Commit-Message, README) kommen als ${vars} aus der
# Textdatei der jeweiligen Sprache – deshalb wird das Bundle pro Sprache gebaut (${locale}).
schemaVersion: 2
id: e2730d6b-0e54-4bd4-b81d-6212a5abde3e
chapter: "1.1"
durationMinutes: 5

provisioning:
  bundle: ./git-config-setup.${locale}.bundle   # relativ zum Aufgabenpaket -> verschiebbar
  keepOrigin: false
  setup:
    # Eine bereits vorhandene, NOCH NICHT committete Testdatei – der Teilnehmer committet sie.
    - printf "${noteContent}\n" > ${noteFile}
  # Hinweis: Die Sandbox setzt Name/E-Mail/Default-Branch mit Platzhaltern vor
  # (user.name=Workshop-Teilnehmer, user.email=workshop@local, init.defaultBranch=main),
  # damit andere Aufgaben committen koennen. Diese Aufgabe verlangt daher KONKRETE
  # Zielwerte (!= Default), die der Teilnehmer aktiv per `git config` setzt. Lokal
  # gesetzte Werte ueberschreiben den globalen Default -> der gepruefte effektive Wert stimmt.

steps:
  - id: set-identity
    goals:
      - type: gitConfig
        key: user.name
        value: Ada Lovelace
      - type: gitConfig
        key: user.email
        value: ada@example.org

  - id: set-default-branch
    goals:
      - type: gitConfig
        key: init.defaultBranch
        value: develop

  - id: commit-file
    goals:
      - type: commitExists
        summary: ${commitMessage}
        reachableFrom: main

  - id: inspect-commit
    goals:
      - type: gitCommandUsed
        name: [show, log]
